<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e1a">
<title>VEXO — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0b0e1a; --panel:#141a2e; --panel2:#1b2340; --line:rgba(255,255,255,.08);
  --text:#eef1fa; --muted:#8e97b8; --accent:#4f6bff; --accent2:#3a55e6;
  --ok:#2ecc8f; --wait:#ffc44d; --warn:#ff9f43; --bad:#ff5c5c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.02em}
.wrap{max-width:900px;margin:0 auto;padding:14px 16px 100px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.auth{width:100%;max-width:380px}
.brand{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#9aa6d6}
h1{font-size:22px;margin:6px 0 18px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em}
input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:70px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--panel2);color:var(--text)}
.btn.primary{background:var(--accent)} .btn.primary:hover{background:var(--accent2)}
.btn.green{background:var(--ok);color:#06251a}
.btn.danger{background:rgba(255,92,92,.15);color:#ff8a8a}
.btn.okb{background:rgba(46,204,143,.15);color:#5fe0ad}
.btn.block{width:100%;margin-top:16px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;margin-top:14px;font-size:13px}
.err{color:#ff8a8a;font-size:13px;margin-top:10px;min-height:1em}
.hint{color:var(--muted);font-size:12px;line-height:1.5;margin-top:10px}

header{position:sticky;top:0;z-index:5;background:rgba(11,14,26,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .in{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
header .t{flex:1;min-width:0}
header .t b{display:block;font-size:15px}
header .t small{color:var(--muted);font-size:12px}
.icon-btn{width:40px;height:40px;border-radius:10px;border:0;background:var(--panel2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.due-banner{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(255,196,77,.16),rgba(255,159,67,.08));border:1px solid rgba(255,196,77,.3);border-radius:14px;padding:12px 14px;margin-bottom:12px;cursor:pointer;width:100%;text-align:left}
.due-banner b{font-size:24px;color:var(--wait)}
.due-banner div{flex:1;font-size:13px;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.search{position:relative;margin-bottom:10px}
.search input{padding-left:40px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent)}
.chip small{opacity:.7;margin-left:4px}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px}
.row .main{flex:1;min-width:0;cursor:pointer}
.row .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .no{font-weight:700}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .l2{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pay-btn{flex:none;padding:10px 12px;font-size:13px}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:3px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.pill.ok{background:rgba(46,204,143,.15);color:var(--ok)}
.pill.wait{background:rgba(255,196,77,.15);color:var(--wait)}
.pill.warn{background:rgba(255,159,67,.15);color:var(--warn)}
.pill.bad{background:rgba(255,92,92,.15);color:var(--bad)}
.pill.arch{background:rgba(142,151,184,.15);color:var(--muted)}
.pill.test{background:rgba(124,140,255,.18);color:#9fb0ff}
.c-pf{font-size:11px;color:var(--muted)}
.codebig{font:700 30px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-align:center;padding:14px;border-radius:12px;background:rgba(124,140,255,.12);margin:8px 0;user-select:all}
.acrow{border:1px solid var(--line,rgba(255,255,255,.1));border-radius:12px;padding:10px 12px;margin:8px 0}
.acrow .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.acrow .m{font-size:12px;color:var(--muted);margin-top:4px}
.payh.void{opacity:.55}
.archbox{margin:12px 0 0;padding:12px;border-radius:10px;background:rgba(142,151,184,.08);border:1px solid rgba(142,151,184,.35);font-size:13px;line-height:1.5}
.empty{text-align:center;color:var(--muted);padding:40px 10px;line-height:1.5}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 28px;border:1px solid var(--line)}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:4px 0 0;font-size:20px}
.sheet .top{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.sheet .top .grow{flex:1;min-width:0}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--panel2);border-radius:10px;padding:10px;font-size:14px;min-width:0;overflow-wrap:anywhere}
.kv small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.sec{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.sec h3{margin:0 0 10px;font-size:13px;color:#c3cae6;text-transform:uppercase;letter-spacing:.06em}
.months{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.months .btn{padding:10px 4px;font-size:13px}
.months .btn.sel{background:var(--accent)}
.preview{margin:12px 0 0;padding:12px;border-radius:10px;background:rgba(46,204,143,.08);border:1px solid rgba(46,204,143,.25);font-size:14px}
.preview b{color:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.rowbtns .btn{flex:1}
.payh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:9px 0;border-bottom:1px solid var(--line)}
.payh:last-child{border-bottom:0}
.payh .m{color:var(--muted)}
.payh .undo{background:none;border:1px solid var(--line);border-radius:8px;color:#ffb0b0;padding:4px 8px;font-size:12px;cursor:pointer;margin-left:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222b4d;border:1px solid var(--line);padding:12px 14px;border-radius:12px;z-index:50;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;align-items:center;gap:12px}
.toast.bad{background:#4a1f26}
.toast button{background:none;border:0;color:#9db0ff;font-weight:700;cursor:pointer;padding:4px;white-space:nowrap}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tools .btn:last-child:nth-child(odd){grid-column:1/-1}
.logrow{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.45}
.logrow:last-child{border-bottom:0}
.logrow .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.logrow .h b{font-size:14px}
.logrow .w{color:var(--muted);font-size:12px;white-space:nowrap}
.logrow .d{color:#c3cae6;margin-top:3px;overflow-wrap:anywhere}
.logrow .m{color:var(--muted);font-size:12px;margin-top:2px}
.errmsg{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#c3cae6;margin-top:4px;overflow-wrap:anywhere}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.warnbox{margin:12px 0 0;padding:12px;border-radius:10px;background:rgba(255,159,67,.08);border:1px solid rgba(255,159,67,.3);font-size:13px;line-height:1.5}
.warnbox b{color:var(--warn)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin-top:10px;text-transform:none;letter-spacing:0;color:var(--text)}
.chk input{width:18px;height:18px;flex:none;margin-top:1px}
.rep-tab{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.rep-tab td{padding:8px 4px;border-bottom:1px solid var(--line)}
.rep-tab td.r{text-align:right;white-space:nowrap}
.big-n{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.big-n div{background:var(--panel2);border-radius:12px;padding:12px}
.big-n b{display:block;font-size:22px}
.big-n span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.prog{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.mgrid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.mgrid b{font-size:20px}
.sheet a{color:#9db0ff}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.months{grid-template-columns:repeat(5,1fr)}.months .btn{font-size:12px}}

/* ===== v2.9.1: sadə görünüş ===== */
.chip.fc{flex-direction:row!important;align-items:center!important;gap:6px!important;border-radius:999px!important;padding:7px 13px!important}
.chip.fc b{font-size:14px!important}
.chip.fc span{font-size:13px!important;text-transform:none!important;letter-spacing:0!important;font-weight:600!important;color:inherit!important}
.fcards{display:flex!important;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px!important}
.fcards::-webkit-scrollbar{display:none}
.subline{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.5}
.subline b{color:var(--text);font-weight:600}
.fold{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:rgba(255,255,255,.015)}
.fold>summary{cursor:pointer;list-style:none;padding:12px 0;font-size:13px;font-weight:700;color:#c3cae6}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"▸ ";color:var(--muted)}
.fold[open]>summary::before{content:"▾ "}
.fold[open]{padding-bottom:12px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi div{background:var(--panel2);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:12px;color:var(--muted)}
.alertline{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(255,196,77,.08);border:1px solid rgba(255,196,77,.25);font-size:13px}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;vertical-align:-3px;margin-right:4px}
.morelist .btn{display:flex;width:100%;justify-content:flex-start;gap:10px;margin-top:8px;text-align:left}
.morelist svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
@media (max-width:999px){
  .row.named .c-mac{display:none}
  .side{position:fixed!important;top:auto!important;bottom:0;left:0;right:0;border-bottom:0!important;border-top:1px solid var(--line);z-index:20}
  .nav{justify-content:space-around;padding:4px 4px calc(4px + env(safe-area-inset-bottom))!important;gap:0!important;overflow:visible!important}
  .nv{flex:1 1 0!important;flex-direction:column;gap:3px!important;border:0!important;background:none!important;border-radius:10px!important;padding:6px 2px!important;font-size:11px!important;color:var(--muted)!important}
  .nv.on{color:#fff!important;background:rgba(79,107,255,.16)!important}
  .nv svg{width:21px!important;height:21px!important}
  .nv.more-only,.nvsep{display:none!important}
  body{padding-bottom:72px}
  .toast{bottom:84px!important}
}
@media (min-width:1000px){ #more{display:none!important} }
/* ===== v2.10: baxış statistikası ===== */
.wchart{margin-top:10px}
.wbars{display:flex;align-items:flex-end;gap:2px;height:96px;border-bottom:1px solid var(--line);position:relative}
.wbars i{flex:1 1 0;min-width:2px;background:var(--accent);border-radius:4px 4px 0 0;opacity:.85;position:relative}
.wbars i.z{background:var(--line);height:2px!important;border-radius:0;opacity:1}
.wbars i:hover{opacity:1;outline:2px solid rgba(255,255,255,.25)}
.wbars i:hover::after{content:attr(data-t);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#0b0e1a;border:1px solid var(--line);color:var(--text);font-size:11px;padding:4px 7px;border-radius:6px;z-index:3;pointer-events:none}
.waxis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.wmax{position:absolute;top:-2px;left:0;font-size:11px;color:var(--muted);border-bottom:1px dashed var(--line);width:100%;pointer-events:none}
.wch{display:grid;grid-template-columns:minmax(90px,1.2fr) 2fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.wch .bar{height:8px;border-radius:0 4px 4px 0;background:var(--accent);opacity:.85;min-width:2px}
.wch .v{color:var(--muted);white-space:nowrap;text-align:right}
.wtab td.r{white-space:nowrap}
/* ===== v2.8.1 layout: menu + content ===== */
[hidden]{display:none!important}
.row .pay-btn{width:112px}
.row .pay-spacer{width:112px;flex:none}
@media (max-width:999px){ .row .pay-spacer{display:none} }
@media (min-width:1000px){ .sheet .kv{grid-template-columns:repeat(3,1fr)} }
.shell{min-height:100vh}
.side{position:sticky;top:0;z-index:6;background:#0e1222;border-bottom:1px solid var(--line)}
.side-brand{display:none}
.nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nv{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.nv svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nv.on{background:var(--accent);border-color:var(--accent)}
.nvsep{display:none}
.mainc header{position:static}
@media (min-width:1000px){
  .shell{display:grid;grid-template-columns:248px 1fr}
  .side{position:sticky;top:0;height:100vh;border-bottom:0;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
  .side-brand{display:block;padding:4px 12px 18px}
  .side-brand b{display:block;font-size:20px;letter-spacing:.08em}
  .side-brand small{color:var(--muted);font-size:12px}
  .nav{flex-direction:column;overflow:visible;padding:0;gap:2px}
  .nv{border:0;background:none;border-radius:10px;padding:11px 12px;font-size:14px;color:#c3cae6}
  .nv:hover{background:var(--panel)}
  .nv.on{background:rgba(79,107,255,.16);color:#fff}
  .nv.on svg{opacity:1;stroke:#9db0ff}
  .nvsep{display:block;margin:16px 12px 6px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .mainc header{position:sticky;top:0}
  .mainc header .in,.mainc .wrap{max-width:1180px;padding-left:28px;padding-right:28px}
  .mainc header .t b{font-size:20px}
}
/* counters = filters */
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;overflow:visible;margin-bottom:12px;padding:0}
.chip.fc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border-radius:12px;padding:10px 12px;text-align:left}
.chip.fc b{font-size:20px}
.chip.fc span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.chip.fc.wait b{color:var(--wait)} .chip.fc.ok b{color:var(--ok)} .chip.fc.warn b{color:var(--warn)} .chip.fc.bad b{color:var(--bad)} .chip.fc.new b{color:#9db0ff}
.chip.fc.on{background:rgba(79,107,255,.16);border-color:var(--accent)}
.chip.fc.on b{color:#fff}
.due-banner .go{font-size:13px;font-weight:700;color:var(--wait);white-space:nowrap}
.due-banner strong{font-size:14px}
.row .nm.noname{color:var(--muted);font-style:italic}
.row .l2 span:empty{display:none}
.row .l2 span+span:not(:empty)::before{content:" · "}
@media (min-width:1000px){
  .row{padding:12px 12px 12px 18px}
  .row .main{display:grid;grid-template-columns:minmax(220px,1.4fr) 3fr;align-items:center;gap:16px}
  .row .l2{margin-top:0;display:grid;grid-template-columns:1.1fr 1fr 1fr 1.2fr;gap:12px;font-size:13px}
  .row .l2 span{display:block!important;overflow:hidden;text-overflow:ellipsis}
  .row .l2 span+span::before{content:none!important}
  .row .l2 span:empty::after{content:"—";opacity:.4}
  .row:hover{border-color:rgba(79,107,255,.35)}
}
/* tabs inside a window */
.tabbar{display:flex;gap:4px;overflow-x:auto;margin:14px -2px 4px;padding:4px;background:var(--panel2);border-radius:12px;scrollbar-width:none;position:sticky;top:-18px;z-index:2}
.tabbar::-webkit-scrollbar{display:none}
.tb{flex:1 0 auto;border:0;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tb.on{background:var(--accent);color:#fff}
.sheet.tabbed .sec{border-top:0;margin-top:10px;padding-top:6px}
.sheet.tabbed .sec h3{color:var(--muted)}
@media (min-width:1000px){ .sheet{max-width:760px} .sheet-bg[data-kind="iptv"] .sheet,.sheet-bg[data-kind="finance"] .sheet,.sheet-bg[data-kind="report"] .sheet,.sheet-bg[data-kind="errors"] .sheet,.sheet-bg[data-kind="activity"] .sheet{max-width:980px!important} }
/* IPTV: fewer numbers on top, filters folded */
.ifold{margin-top:10px}
.ifold summary{cursor:pointer;color:#c3cae6;font-size:13px;font-weight:700;padding:8px 2px;list-style:none}
.ifold summary::-webkit-details-marker{display:none}
.ifold summary::before{content:"▸ ";color:var(--muted)}
.ifold[open] summary::before{content:"▾ "}
.sumline{font-size:13px;color:#c3cae6;line-height:1.6}
@media (max-width:999px){
  .fcards{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px}
  .fcards::-webkit-scrollbar{display:none}
  .chip.fc{flex:0 0 auto;min-width:92px;padding:8px 12px}
  .chip.fc b{font-size:18px}
  .sheet-bg[data-kind="iptv"] .mgrid{grid-template-columns:repeat(4,1fr)}
  .sheet-bg[data-kind="iptv"] .mgrid div{padding:10px 8px}
  .sheet-bg[data-kind="iptv"] .mgrid span{font-size:10px}

/* ---- Bakı vaxtı (UTC+4, yay vaxtı yoxdur) ---- */
var OFF = 4*3600*1000;
function bk(ms){ var d=new Date(ms+OFF); return { y:d.getUTCFullYear(), m:d.getUTCMonth(), d:d.getUTCDate(), h:d.getUTCHours(), mi:d.getUTCMinutes() }; }
function bkMidnight(y,m,d){ return Date.UTC(y,m,d) - OFF; }
function daysIn(y,m){ return new Date(Date.UTC(y,m+1,0)).getUTCDate(); }
// Cari dövr sərhədi: bu ayın 1-i gün sonu (= 2-si 00:00)
function boundary(now){ var p=bk(now); return bkMidnight(p.y,p.m,2); }
function addMonths(ms, n){
  var p=bk(ms), base=bkMidnight(p.y,p.m,p.d), rest=ms-base;
  var y=p.y + Math.floor((p.m+n)/12), m=(p.m+n)%12;
  return bkMidnight(y,m,Math.min(p.d,daysIn(y,m))) + rest;
}
// Serverdəki add_payment ilə eyni qayda
function nextExpiry(expIso, months){
  var b = boundary(Date.now());
  var base = Math.max(expIso ? Date.parse(expIso) : b, b);
  return addMonths(base, months);
}
// Ödəniş gözlənilən növbəti sərhəd (ayın 1-i gün sonu)
function upcomingBoundary(){
  var now=Date.now(), b=boundary(now);
  return now < b ? b : addMonths(b,1);
}
// "Son gün": bitmə anından 1 ms əvvəl
function lastDay(ms){ var p=bk(ms-1); return p.d+' '+AYLAR[p.m]+' '+p.y; }
function lastDayShort(ms){ var p=bk(ms-1); return p.d+' '+AYLAR[p.m].slice(0,3); }
function fmtDT(iso){ if(!iso) return '—'; var p=bk(Date.parse(iso)); return pad(p.d)+'.'+pad(p.m+1)+'.'+p.y+' '+pad(p.h)+':'+pad(p.mi); }
function ago(iso){
  if(!iso) return 'heç vaxt';
  var m=Math.round((Date.now()-Date.parse(iso))/60000);
  if(m<1) return 'indicə'; if(m<60) return m+' dəq əvvəl';
  var h=Math.round(m/60); if(h<24) return h+' saat əvvəl';
  return Math.round(h/24)+' gün əvvəl';
}

function statusOf(d){ if(d.archived_at) return 'archived'; if(d.blocked) return 'blocked'; if(!d.expires_at) return 'pending'; return Date.parse(d.expires_at) <= Date.now() ? 'expired' : 'active'; }
function isDue(d){ return !d.archived_at && !d.is_test && !!d.expires_at && Date.parse(d.expires_at) <= upcomingBoundary(); }
/* v2.11: which build the TV runs (sent by the app as "platform") */
function pfLabel(p){ return ({ tv:'TV', phone:'Telefon', 'play-tv':'TV · Google Play', 'play-phone':'Telefon · Google Play', tizen:'Samsung TV' })[p] || ''; }
function pfShort(p){ return p==='play-tv'||p==='play-phone' ? 'Play' : p==='tizen' ? 'Samsung' : ''; }
function label(d){ return '#'+(d.customer_no||'—') + (d.customer_name ? ' · '+d.customer_name : ''); }

function toast(msg, opts){
  opts = opts || {};
  var old=document.querySelector('.toast'); if(old) old.remove();
  var t=document.createElement('div'); t.className='toast'+(opts.bad?' bad':'');
  var s=document.createElement('span'); s.textContent=msg; t.appendChild(s);
  if(opts.action){ var b=document.createElement('button'); b.textContent=opts.action[0]; b.onclick=function(){ t.remove(); opts.action[1](); }; t.appendChild(b); }
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, opts.action ? 7000 : 2800);
}

async function boot(){

  if(!url || !key) return renderSetup();
  try { sb = supabase.createClient(url, key, { auth:{ persistSession:true, autoRefreshToken:true } }); }
  catch(e){ return renderSetup('Server ünvanı və ya açar səhvdir.'); }
  var s = await sb.auth.getSession();
  if(!s.data.session) return renderLogin();
  var r = await sb.rpc('is_admin');
  if(r.error || r.data !== true){ await sb.auth.signOut(); return renderLogin(r.error ? errText(r.error) : 'Bu hesab admin siyahısında deyil.'); }
  renderMain(); load();
}

async function load(){
  var r = await sb.from('devices').select('*').order('customer_no', { ascending:true }).limit(5000);
  if(r.error){ toast(errText(r.error), {bad:true}); return; }
  devices = r.data || [];
  if(!settingsCache) await loadSettingsCache();
  await loadIptv();
  try { await loadWatchIdle(); } catch(e){ watchByDev=null; }
  renderList();
  if(current && document.querySelector('.sheet-bg[data-kind="device"]')) openDevice(current);
}

function counts(){
  var c={ all:0, active:0, pending:0, expired:0, blocked:0, due:0, noiptv:0, archived:0, idle:0, test:0 };
  devices.forEach(function(d){ var s=statusOf(d); c[s]++; if(s==='archived') return; c.all++; if(d.is_test) c.test++; if(isDue(d)) c.due++; if(isIdle(d)) c.idle++; if(iptv && s==='active' && !d.replaced_by && !iptvByDev[d.id]) c.noiptv++; });
  return c;
}
function matches(d){
  var arch=statusOf(d)==='archived';   /* v2.9: arxivdəkilər yalnız "Arxiv" filtrində görünür */
  if(filter==='archived'){ if(!arch) return false; }
  else if(arch) return false;
  else if(filter==='due'){ if(!isDue(d)) return false; }
  else if(filter==='idle'){ if(!isIdle(d)) return false; }
  else if(filter==='test'){ if(!d.is_test) return false; }
  else if(filter==='noiptv'){ if(!(statusOf(d)==='active' && !d.replaced_by && !iptvByDev[d.id])) return false; }
  else if(filter!=='all' && statusOf(d)!==filter) return false;
  if(!query) return true;
  var q=query.toLowerCase().replace(/[\s\-#:()+]/g,'');
  var hay=[d.customer_no, d.mac, d.customer_name, d.phone, d.note, d.model, iptvByDev[d.id]?iptvByDev[d.id].acc.subuser:''].join('|').toLowerCase().replace(/[\s\-#:()+]/g,'');
  return hay.indexOf(q) >= 0;
}

function renderList(){
  var c=counts(), ub=upcomingBoundary();

/* v2.8.1: long windows are split into tabs (same content, same buttons — just grouped).
   The groups are found by the section titles, so every window keeps its own logic. */
var TABS={
  device:[['Ödəniş',/Ödəniş alındı|^Aktivləşdir/],['Müştəri',/^Müştəri$|Müştəriyə mesaj/],['IPTV',/IPTV xidməti/],['Cihaz',/Cihaz məlumatı|Quraşdırma və cihaz|Quraşdırıcı kodu/],['Tarixçə',/tarixçəsi/],['Əlavə',/^Əlavə$/]],
  account:[['Yerlər',/^Yerlər/],['Playlist',/Playlist məlumatı/],['Paketlər',/Paketlər/],['Tarixçə',/^Tarixçə/],['Əlavə',/^Əlavə$/]],
  finance:[['Xülasə',/Aylar üzrə/],['Qeydlər',/Yeni gəlir|Bu dövrün qeydləri/],['Partnyorlar',/Partnyorlar/],['Ayarlar',/^Ayarlar$/]],
  settings:[['Qeydiyyat',/Yeni cihaz qeydiyyatı|Limitlər/],['Təmizləmə',/Köhnə gözləyən/],['Statistika',/Baxış statistikası/],['IPTV rejimi',/2 müştəri/]]
};
var tabSel={}, tabBusy=false;
function tabify(bg){
  var kind=bg.getAttribute('data-kind'), conf=TABS[kind]; if(!conf) return;
  var sh=bg.querySelector('.sheet'); if(!sh || sh.querySelector('.tabbar')) return;
  var secs=[].filter.call(sh.querySelectorAll('.sec'), function(x){ return !x.parentElement.closest('.sec'); });
  if(secs.length<3) return;
  var groups=conf.map(function(){ return []; });
  secs.forEach(function(sec){
    var h=sec.querySelector('h3'), t=h?h.textContent.trim():'', gi=0;
    conf.forEach(function(c,i){ if(c[1].test(t)) gi=i; });
    if(h && !conf.some(function(c){ return c[1].test(t); })) gi=0;
    groups[gi].push(sec); sec.setAttribute('data-tab',gi);
  });
  var used=conf.map(function(c,i){ return groups[i].length?i:-1; }).filter(function(i){ return i>=0; });
  if(used.length<2) return;
  var sel=tabSel[kind]; if(used.indexOf(sel)<0) sel=used[0];
  tabBusy=true;
  var bar=document.createElement('div'); bar.className='tabbar';
  bar.innerHTML=used.map(function(i){ return '<button class="tb'+(i===sel?' on':'')+'" data-tabbtn="'+i+'">'+conf[i][0]+'</button>'; }).join('');
  secs[0].parentNode.insertBefore(bar, secs[0]);
  sh.classList.add('tabbed');
  function show(i){
    tabSel[kind]=i;
    secs.forEach(function(x){ x.hidden = +x.getAttribute('data-tab')!==i; });
    bar.querySelectorAll('.tb').forEach(function(b){ b.classList.toggle('on', +b.getAttribute('data-tabbtn')===i); });
  }
  bar.onclick=function(e){ var b=e.target.closest('[data-tabbtn]'); if(b) show(+b.getAttribute('data-tabbtn')); };
  show(sel);
  tabBusy=false;
}
/* open a tab by its name (also used by the tests) */
window.adminTab=function(name){
  var bar=document.querySelector('.sheet-bg .tabbar'); if(!bar) return false;
  var b=[].find.call(bar.querySelectorAll('.tb'), function(x){ return x.textContent===name; }); if(b) b.click(); return !!b;
};
new MutationObserver(function(){
  if(tabBusy) return;
  document.querySelectorAll('.sheet-bg').forEach(tabify);
}).observe(document.documentElement, { childList:true, subtree:true });

function sheet(kind){
  closeSheet();
  tabSel[kind]=undefined;   /* a newly opened window starts on its first tab */
  setTimeout(function(){ navMark(kind); },0);
  var bg=document.createElement('div'); bg.className='sheet-bg'; bg.setAttribute('data-kind',kind);
  bg.onclick=function(e){ if(e.target===bg) closeSheet(); };
  document.body.appendChild(bg);
  document.addEventListener('keydown', escClose);
  return bg;
}
/* menu highlight follows the open window */
var NAVK={iptv:'iptvb',account:'iptvb',finance:'finb',report:'rep',errors:'errs',release:'upd',activity:'act',settings:'cfgr',codes:'acd'};
function navMark(kind){ document.querySelectorAll('.nv').forEach(function(b){ b.classList.toggle('on', b.id===(NAVK[kind]||'nvc')); }); }
function closeSheet(){
  var bg=document.querySelector('.sheet-bg'); if(bg) bg.remove();
  navMark('');
  document.removeEventListener('keydown', escClose);
}
function escClose(e){ if(e.key==='Escape'){ current=null; closeSheet(); } }

var MONTHS=[1,2,3,6,12];
/* v2.9: tarif serverdə saxlanılır (müştərinin tarifi, yoxdursa standart tarif) */
function isV29(d){ return !!d && ('archived_at' in d); }
function stdFee(){ return settingsCache && settingsCache.monthly_fee_azn!=null ? Number(settingsCache.monthly_fee_azn) : null; }
function feeOf(d){ return d.monthly_fee_azn!=null ? Number(d.monthly_fee_azn) : stdFee(); }
function newReqId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  var b=new Uint8Array(16); crypto.getRandomValues(b); b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128;
  var h=[].map.call(b,function(x){ return (x<16?'0':'')+x.toString(16); }).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
function payBlockHtml(d){
  var v29=isV29(d);
  return (v29?'<div class="hint" id="pfee" style="margin-top:0"></div>':'')+
    '<div class="months">'+MONTHS.map(function(n,i){ return '<button class="btn'+(i===0?' sel':'')+'" data-m="'+n+'">'+n+' ay</button>'; }).join('')+'</div>'+
    '<div class="preview" id="pv"></div>'+
    '<div class="grid2"><div><label>Məbləğ (AZN)</label><input id="amt" type="number" inputmode="decimal" min="0" step="0.01" value="'+(v29?'':esc(LS.get('mrb_last_amount')||''))+'"></div>'+
    '<div><label>Kim aldı</label><input id="prcv" list="partners" value="'+esc(LS.get('mrb_last_rcv')||'')+'"></div></div>'+
    '<details class="fold"><summary>Ödəniş üsulu və qeyd</summary><div class="grid2">'+
    '<div><label>Üsul</label><select id="pmeth"><option value="">—</option><option value="cash">Nağd</option><option value="card">Kart</option><option value="transfer">Köçürmə</option><option value="other">Digər</option></select></div>'+
    '<div><label>Qeyd</label><input id="pnote" placeholder="istəyə bağlı"></div></div></details>'+
    (v29?'<div id="ovr" hidden><div class="warnbox"><b>Məbləğ tarifdən fərqlidir.</b> Endirim və ya fərqli məbləğ üçün səbəb yazın — təsdiqdən sonra qeyd olunacaq.</div>'+
      '<label>Fərqli məbləğin səbəbi</label><input id="preason" maxlength="300" placeholder="məs. 3 aylıq ödənişə endirim"></div>':'')+
    partnerOptions();
}
function wirePayBlock(root, d, onDone){
  var months=1, v29=isV29(d), fee=v29?feeOf(d):null, amtEl=root.querySelector('#amt'), rid=v29?newReqId():null;
  function expected(){ return fee==null ? null : Math.round(fee*100)*months/100; }
  function differs(){
    var raw=amtEl.value.trim(), e=expected();
    if(raw==='') return false;
    return e==null || Math.round(Number(raw)*100)!==Math.round(e*100);
  }
  function upd(){
    var ms=nextExpiry(d.expires_at, months), e=expected();
    root.querySelector('#pv').innerHTML='Yeni bitmə: <b>'+lastDay(ms)+'</b>'+
      (v29 && e!=null ? ' · '+months+' × '+fee.toFixed(2)+' = <b>'+e.toFixed(2)+' ₼</b>' : '');
    if(v29) root.querySelector('#ovr').hidden=!differs();
  }
  function setAuto(){ var e=expected(); amtEl.value = e==null ? '' : e.toFixed(2); }
  if(v29){
    root.querySelector('#pfee').innerHTML = fee!=null
      ? 'Tarif: <b>'+fee.toFixed(2)+' ₼ / ay</b> ('+(d.monthly_fee_azn!=null?'bu müştərinin tarifi':'standart tarif')+')'
      : '<b style="color:var(--warn)">Aylıq tarif təyin edilməyib.</b> Məbləği yazın və səbəbini göstərin, ya da "Müştəri" bölməsində tarif təyin edin.';
    setAuto();
    amtEl.oninput=upd;
  }
  root.querySelectorAll('[data-m]').forEach(function(b){
    b.onclick=function(){ months=+b.getAttribute('data-m'); root.querySelectorAll('[data-m]').forEach(function(x){ x.classList.toggle('sel',x===b); }); if(v29) setAuto(); upd(); };
  });
  upd();
  return async function(){
    var amtRaw=amtEl.value.trim();
    var meth=root.querySelector('#pmeth').value||null, rcv=root.querySelector('#prcv').value.trim()||null;
    var note=root.querySelector('#pnote').value.trim()||null;
    var r, saved;
    if(v29){
      if(amtRaw===''){ toast('Məbləği yazın — boş məbləğlə ödəniş qeyd olunmur',{bad:true}); amtEl.focus(); return 'skip'; }
      var amt=Math.round(Number(amtRaw)*100)/100;
      if(!isFinite(amt) || amt<0){ toast('Məbləğ səhvdir',{bad:true}); amtEl.focus(); return 'skip'; }
      var reason=null, e=expected();
      if(differs()){
        reason=root.querySelector('#preason').value.trim();
        if(reason.length<3){ toast('Fərqli məbləğ üçün səbəb yazın',{bad:true}); root.querySelector('#preason').focus(); return 'skip'; }
        if(!confirm('Məbləğ tarifdən fərqlidir.\n\nTarifə görə: '+(e==null?'— (tarif yoxdur)':e.toFixed(2)+' ₼')+'\nDaxil edilən: '+amt.toFixed(2)+' ₼\nSəbəb: '+reason+'\n\nBu məbləğlə qeyd edilsin?')) return 'skip';
      }
      if(rcv) LS.set('mrb_last_rcv', rcv);
      r=await sb.rpc('record_payment',{ p_device_id:d.id, p_months:months, p_amount:amt, p_override_reason:reason,
        p_method:meth, p_received_by:rcv, p_note:note, p_request_id:rid, p_check_expires:true, p_expect_expires:d.expires_at||null });
      if(r.error && v28missing(r.error) && /record_payment/.test(r.error.message||'')) throw new Error('Supabase-də v2.9.0 miqrasiyası işlədilməyib.');
      if(r.error && /VX:stale_customer/.test(r.error.message||'')){ toast(VXMSG.stale_customer,{bad:true}); if(onDone) onDone(); await load(); return 'skip'; }
      if(r.error) throw r.error;
      rid=newReqId();
      saved=r.data.device;
      if(r.data.duplicate){ toast('Bu ödəniş artıq qeyd olunub (təkrar basılma) — ikinci dəfə yazılmadı'); if(onDone) onDone(); return; }
    } else {
      if(amtRaw!=='') LS.set('mrb_last_amount', amtRaw);
      if(rcv) LS.set('mrb_last_rcv', rcv);
      var args={ p_device_id:d.id, p_months:months, p_days:0, p_amount: amtRaw===''?null:Number(amtRaw), p_note: note };
      r=await sb.rpc('add_payment_ex', Object.assign({ p_method:meth, p_received_by:rcv }, args));
      if(r.error && v28missing(r.error)) r=await sb.rpc('add_payment', args);   /* v2.8 miqrasiyası hələ yoxdursa */
      if(r.error) throw r.error;
      saved=r.data;
    }
    toast(label(d)+' → '+lastDay(Date.parse(saved.expires_at))+' qədər', { action:['Geri al', function(){ undoLast(d.id); }] });
    if(onDone) onDone();
  };
}

async function undoLast(deviceId){
  var r=await sb.from('payments').select('*').eq('device_id',deviceId).order('id',{ascending:false}).limit(20);
  var last=(r.data||[]).find(function(p){ return !p.voided_at; });
  if(r.error || !last){ toast('Geri alınacaq ödəniş yoxdur', {bad:true}); return; }
  var u=await sb.rpc('undo_payment', { p_payment_id:last.id });

  toast('Ödəniş geri alındı'); load();
}

/* ---- v2.11: Aktivləşdirmə kodları ----
   A code activates a TV for N days without sending the MAC to the seller. Used for sales and for
   Google / Samsung reviewers (test codes + an authorized demo playlist). The code is shown ONCE. */
function codeFmt(c){ return String(c).replace(/(\d{4})(\d{4})(\d{4})/,'$1-$2-$3'); }
var AC_ST={ active:['Aktiv','ok'], used_up:['Limit dolub','warn'], expired:['Vaxtı bitib','arch'], revoked:['Ləğv edilib','bad'] };
async function openCodes(fresh){
  var bg=sheet('codes');
  bg.innerHTML='<div class="sheet"><div class="top"><div class="grow"><h2>Aktivləşdirmə kodları</h2></div><button class="icon-btn" id="x">'+ICON.close+'</button></div>'+
    '<div class="hint" style="margin-top:0">Müştəri TV-də "Aktivləşdirmə kodu" düyməsini basıb 12 rəqəmli kodu yazır — abunə dərhal açılır. Kod yalnız bir dəfə, yarananda göstərilir; bazada saxlanılmır.</div>'+
    (fresh ? '<div class="sec"><h3>Yeni kod</h3><div class="codebig" id="newcode">'+esc(codeFmt(fresh.code))+'</div>'+
      '<div class="rowbtns"><button class="btn primary" id="cpy">Kopyala</button></div>'+
      '<div class="hint">Bu kodu indi yazın və ya kopyalayın — bu pəncərə bağlanandan sonra kodu yenidən görmək olmur (yalnız son 4 rəqəmi: '+esc(fresh.hint)+').</div></div>' : '')+
    '<div class="sec"><h3>Yeni kod yarat</h3>'+
      '<label>Ad (siyahıda və müştəri adı kimi görünür)</label><input id="aclb" maxlength="60" placeholder="məs. Google Play Review və ya Kampaniya oktyabr">'+
      '<div class="grid2"><div><label>Abunə neçə gün açılsın</label><input id="acdays" type="number" min="1" max="400" value="31"></div>'+
      '<div><label>Neçə TV-də işləsin</label><input id="acuses" type="number" min="1" max="500" value="1"></div></div>'+
      '<label>Kod neçə gün etibarlı olsun</label><input id="acvalid" type="number" min="1" max="400" value="30">'+
      '<label class="chk"><input type="checkbox" id="actest"> Test kodu (Google / Samsung yoxlayıcısı — cihaz "Test" işarələnir, ödəniş gözləntisinə düşmür)</label>'+
      '<details><summary>Başlanğıc playlist (istəyə görə)</summary>'+
        '<div class="hint">Kodla birlikdə TV-yə adi M3U linki kimi əlavə olunur. Yalnız <b>yayım hüququ olan</b> məzmun (məs. açıq test axınları) üçün istifadə edin. Provayder (TVTEAM) hesablarını buraya yazmayın.</div>'+
        '<label>Playlist adı</label><input id="acpn" maxlength="40" placeholder="VEXO Demo">'+
        '<label>M3U linki (https://…)</label><input id="acpu" maxlength="500" placeholder="https://…/demo.m3u"></details>'+
      '<label>Qeyd (istəyə görə)</label><input id="acnote" maxlength="200">'+
      '<button class="btn primary block" id="acmk">Kod yarat</button></div>'+
    '<div class="sec"><h3>Kodlar</h3><div id="aclist" class="hint" style="margin-top:0">Yüklənir…</div></div></div>';
  bg.querySelector('#x').onclick=closeSheet;
  if(fresh){
    bg.querySelector('#cpy').onclick=function(){
      try { navigator.clipboard.writeText(codeFmt(fresh.code)).then(function(){ toast('Kopyalandı'); }, function(){ toast('Kopyalamaq olmadı — kodu əl ilə yazın',{bad:true}); }); }
      catch(e){ toast('Kopyalamaq olmadı — kodu əl ilə yazın',{bad:true}); }
    };
  }
  bg.querySelector('#acmk').onclick=async function(){
    var b=this, lb=bg.querySelector('#aclb').value.trim();
    var days=+bg.querySelector('#acdays').value, uses=+bg.querySelector('#acuses').value, valid=+bg.querySelector('#acvalid').value;
    var pu=bg.querySelector('#acpu').value.trim(), pn=bg.querySelector('#acpn').value.trim();
    if(lb.length<2){ toast('Kodun adını yazın',{bad:true}); return; }
    if(!(days>=1&&days<=400) || !(uses>=1&&uses<=500) || !(valid>=1&&valid<=400)){ toast('Rəqəmləri yoxlayın (gün 1–400, TV 1–500)',{bad:true}); return; }
    if(pu && !/^https?:\/\/\S+$/.test(pu)){ toast('Playlist linki http:// və ya https:// ilə başlamalıdır',{bad:true}); return; }
    b.disabled=true;
    try {
      var r=await sb.rpc('create_activation_code',{ p_label:lb, p_grant_days:days, p_max_uses:uses, p_valid_days:valid,
        p_is_test:bg.querySelector('#actest').checked, p_playlist_name:pn||null, p_playlist_url:pu||null, p_note:bg.querySelector('#acnote').value.trim()||null });
      if(r.error) throw r.error;
      openCodes(r.data);
    } catch(e){ toast(codeErr(e),{bad:true}); b.disabled=false; }
  };
  var box=bg.querySelector('#aclist');
  var r=await sb.rpc('activation_code_list');
  if(!document.body.contains(box)) return;
  if(r.error){ box.innerHTML=esc(codeErr(r.error)); bg.querySelector('#acmk').disabled=/v2\.11/.test(codeErr(r.error)); return; }
  var rows=r.data||[];
  box.innerHTML = rows.length ? rows.map(function(c){
    var st=AC_ST[c.state]||AC_ST.active;
    return '<div class="acrow"><div class="h"><b>'+esc(c.label)+' <span class="mono">····'+esc(c.hint)+'</span></b><span><span class="pill '+st[1]+'">'+st[0]+'</span>'+(c.is_test?' <span class="pill test">Test</span>':'')+'</span></div>'+
      '<div class="m">'+c.grant_days+' gün abunə · istifadə: '+c.used_count+' / '+c.max_uses+' TV · etibarlı: '+esc(fmtDT(c.valid_until).slice(0,10))+'-dək'+(c.playlist_url?' · playlist: '+esc(c.playlist_name||'')+'':'')+'</div>'+
      (c.devices&&c.devices.length ? '<div class="m">TV-lər: '+c.devices.map(function(x){ return '<a href="#" data-dv="'+x.device_id+'">#'+esc(x.customer_no)+(x.customer_name?' '+esc(x.customer_name):'')+'</a>'; }).join(', ')+'</div>' : '')+
      (c.note?'<div class="m">'+esc(c.note)+'</div>':'')+
      (c.state==='active'||c.state==='used_up' ? '<div class="rowbtns"><button class="btn" data-rv="'+c.id+'" data-rvt="'+(c.is_test?1:0)+'">Ləğv et</button></div>' : '')+
    '</div>';
  }).join('') : '<div class="empty">Hələ kod yoxdur.</div>';
  box.querySelectorAll('[data-dv]').forEach(function(a){ a.onclick=async function(e){ e.preventDefault(); await load(); openDevice(a.getAttribute('data-dv')); }; });
  box.querySelectorAll('[data-rv]').forEach(function(b){ b.onclick=async function(){
    if(!confirm('Kod ləğv edilsin?\n\nKod bir daha qəbul olunmayacaq. Bu kodla artıq açılmış adi müştəri TV-lərinə toxunulmur.')) return;
    var blockTest=false;
    if(b.getAttribute('data-rvt')==='1') blockTest=confirm('Bu TEST kodu ilə açılmış test cihazları da indi bloklansın?\n\n(Məs. Google / Samsung yoxlaması bitibsə — "OK". Yalnız "Test" işarəli cihazlar bloklanır.)');
    b.disabled=true;
    var q=await sb.rpc('revoke_activation_code',{ p_id:+b.getAttribute('data-rv'), p_block_test_devices:blockTest });
    if(q.error){ toast(codeErr(q.error),{bad:true}); b.disabled=false; return; }
    toast('Kod ləğv edildi'+(q.data&&q.data.blocked_test_devices?' · '+q.data.blocked_test_devices+' test cihazı bloklandı':'')); load(); openCodes();
  }; });
}
function codeErr(e){
  var m=String((e&&(e.message||e.details))||e||'');
  if(/Could not find the function|does not exist|PGRST202/.test(m)) return 'Bu funksiya üçün Supabase-də v2.11.0 miqrasiyası işlədilməlidir.';
  var k={ bad_label:'Kodun adını yazın (1–60 simvol).', bad_days:'Abunə günü 1–400 olmalıdır.', bad_uses:'TV sayı 1–500 olmalıdır.', bad_valid:'Etibarlılıq 1–400 gün olmalıdır.', bad_url:'Playlist linki düzgün deyil.', not_found:'Kod tapılmadı.' };
  var mm=m.match(/VX:([a-z_]+)/); if(mm && k[mm[1]]) return k[mm[1]];
  return errText(e);
}

/* ---- v2.10: Baxış statistikası ---- */
var wRange=7;
async function openWatch(){
  var bg=sheet('watch');
  bg.innerHTML='<div class="sheet"><div class="top"><div class="grow"><h2>Baxış statistikası</h2></div><button class="icon-btn" id="x">'+ICON.close+'</button></div><div id="wb" class="hint">Yüklənir…</div></div>';
  bg.querySelector('#x').onclick=closeSheet;
  var to=todayStr(), from=addDaysStr(to,-(wRange-1));
  var r=await sb.rpc('watch_overview',{ p_from:from, p_to:to });
  var box=bg.querySelector('#wb'); if(!box) return;
  if(r.error){ box.textContent=v28missing(r.error)?'Supabase-də v2.10.0 miqrasiyası işlədilməyib.':errText(r.error); return; }
  var R=r.data, T=R.totals||{}, cust=R.customers||[];
  var active=cust.length, viewers=cust.filter(function(c){ return +c.seconds>0; }).length;
  var idle=cust.filter(function(c){ return !(+c.seconds>0); });
  var avg=viewers ? (+T.seconds||0)/viewers/R.days : 0;
  var chTot=+R.channels_total||0, chMax=(R.channels||[]).reduce(function(m,c){ return Math.max(m,+c.seconds); },0);
  box.className='';
  box.innerHTML=
    '<div class="chips">'+[[1,'Bu gün'],[7,'7 gün'],[30,'30 gün'],[90,'90 gün']].map(function(x){ return '<button class="chip'+(wRange===x[0]?' on':'')+'" data-wr="'+x[0]+'">'+x[1]+'</button>'; }).join('')+'</div>'+
    '<div class="subline" style="margin-top:6px">'+dshort(R.from)+' — '+dshort(R.to)+'</div>'+

/* ---- Tətbiq yeniləməsi (APK) ---- */
function verCode(v){ var m=String(v||'').trim().match(/^(\d+)\.(\d+)\.(\d+)$/); return m ? (+m[1])*10000+(+m[2])*100+(+m[3]) : 0; }
async function openRelease(){
  var bg=sheet('release');
  bg.innerHTML='<div class="sheet"><div class="top"><div class="grow"><h2>Tətbiq yeniləməsi</h2></div><button class="icon-btn" id="x">'+ICON.close+'</button></div><div id="rl" class="hint">Yüklənir…</div></div>';
  bg.querySelector('#x').onclick=closeSheet;
  var r=await sb.from('app_release').select('*').eq('id',1).maybeSingle();
  var box=bg.querySelector('#rl'); if(!box) return;
  if(r.error){ box.innerHTML=esc(errText(r.error))+'<br>Supabase-də yeni schema.sql işlədilib?'; return; }
  var cur=r.data;
  var onLatest=cur? devices.filter(function(d){ return d.app_version===cur.version_name; }).length : 0;
  box.className='';
  box.innerHTML=
    (cur ? '<div class="subline" style="margin-top:0">Göndərilən versiya: <b>'+esc(cur.version_name)+'</b> ('+fmtDT(cur.updated_at).slice(0,10)+') · bu versiyada: <b>'+onLatest+' / '+devices.length+'</b> TV'+(cur.notes?'<br>Qeyd: '+esc(cur.notes):'')+'</div>' :
      '<div class="subline" style="margin-top:0">Hələ yeniləmə göndərilməyib.</div>')+
    '<div class="hint" style="margin-top:0">Bu bölmə yalnız <b>müstəqil APK</b> quraşdırılmış TV-lərə aiddir. Google Play və Samsung versiyaları öz mağazasından yenilənir: onlar APK yükləmir. "Məcburi versiya" onlara yalnız "mağazadan yeniləyin" xatırlatması kimi göstərilir (bloklamır).</div>'+
    '<div class="sec"><h3>Yeni versiya göndər</h3>'+
      '<label>1. APK faylı</label><input id="apk" type="file" accept=".apk,application/vnd.android.package-archive">'+
      '<label>2. Versiya (özü yazılır)</label><input id="vn" placeholder="APK seçin" inputmode="decimal">'+
      '<label>3. Müştəriyə qeyd (istəyə bağlı)</label><input id="vt" maxlength="200" placeholder="məs. Kanallar daha tez açılır">'+
      '<div class="prog" id="pg" style="display:none"><i id="pgb"></i></div>'+
      '<button class="btn primary block" id="go">Göndər</button>'+
      '<div class="hint">TV-lər 5 dəqiqə ərzində "Yeni versiya var" görəcək.</div>'+
      (cur?'<button class="link" id="stop">Yeniləmə təklifini dayandır</button>':'')+
    '</div>'+
    (cur ? '<details class="fold"><summary>Məcburi yeniləmə (yalnız təcili hallar üçün)</summary>'+minVersionHtml(cur)+'</details>' : '');
  var vn=box.querySelector('#vn'), apk=box.querySelector('#apk');
  /* the version is read from the APK itself (assets/public/appinfo.json) */
  apk.onchange=async function(){
    var f=apk.files[0]; if(!f) return;
    var m=(f.name||'').match(/(\d+\.\d+\.\d+)/); if(m) vn.value=m[1];
    try {
      if(!window.JSZip) await new Promise(function(ok,no){ var sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; sc.onload=ok; sc.onerror=no; document.head.appendChild(sc); });
      var zip=await JSZip.loadAsync(f);
      var e=zip.file('assets/public/appinfo.json');
      if(!e){ toast('Bu fayl VEXO APK-sı deyil',{bad:true}); return; }
      var info=JSON.parse(await e.async('string'));
      if(info && info.version){ vn.value=info.version; vn.readOnly=true; toast('APK versiyası: '+info.version); }
    } catch(err){ /* not readable: type the version by hand */ }
  };
  box.querySelector('#go').onclick=guard(async function(){
    var f=apk.files && apk.files[0];
    if(!f){ toast('APK faylını seçin',{bad:true}); return 'skip'; }
    var v=vn.value.trim(), code=verCode(v);
    if(!code){ toast('Versiyanı 2.5.0 formatında yazın',{bad:true}); return 'skip'; }
    if(cur && code<=cur.version_code && !confirm('Bu versiya ('+v+') hazırkıdan ('+cur.version_name+') yeni deyil. Yenə də davam edilsin?')) return 'skip';
    if(f.size>95*1024*1024){ toast('Fayl çox böyükdür',{bad:true}); return 'skip'; }
    var pg=box.querySelector('#pg'), pgb=box.querySelector('#pgb'); pg.style.display='block'; pgb.style.width='30%';
    var path='vexo-'+v+'.apk';
    var up=await sb.storage.from('apk').upload(path, f, { upsert:true, contentType:'application/vnd.android.package-archive', cacheControl:'300' });
    if(up.error) throw up.error;
    pgb.style.width='80%';
    var url=sb.storage.from('apk').getPublicUrl(path).data.publicUrl;
    var w=await sb.from('app_release').upsert({ id:1, version_name:v, version_code:code, apk_url:url, notes:box.querySelector('#vt').value.trim()||null, updated_at:new Date().toISOString() });
    if(w.error) throw w.error;
    pgb.style.width='100%';
    toast('Versiya '+v+' göndərildi');
    openRelease();
  });
  var stop=box.querySelector('#stop');
  if(stop) stop.onclick=guard(async function(){ if(!confirm('TV-lərə yeniləmə təklifi dayandırılsın?'+(cur.min_version_code?' Məcburi yeniləmə də söndürüləcək.':''))) return 'skip'; var d=await sb.from('app_release').delete().eq('id',1); if(d.error) throw d.error; toast('Dayandırıldı'); openRelease(); });
  if(cur) wireMinVersion(box, cur);
}

/* ================= v2.7: məcburi yeniləmə ================= */
function versionStats(code){
  var below=0, belowActive=0, byVer={}, unknown=0;
  devices.forEach(function(d){
    var c=verCode(d.app_version);
    if(!c){ unknown++; return; }
    if(c<code){ below++; if(statusOf(d)==='active') belowActive++; byVer[d.app_version]=(byVer[d.app_version]||0)+1; }
  });
  return { below:below, belowActive:belowActive, byVer:byVer, unknown:unknown };
}
function minVersionHtml(cur){
  var on=cur.min_version_code>0;
  var st=versionStats(cur.version_code);
  var latestOn=devices.filter(function(d){ return verCode(d.app_version)>=cur.version_code; }).length;
  var vers=Object.keys(st.byVer).sort().map(function(v){ return esc(v)+': '+st.byVer[v]; }).join(' · ');
  return '<div class="sec"><h3>Məcburi yeniləmə</h3>'+
    (on ? '<div class="warnbox" style="margin-top:0"><b>Aktivdir:</b> '+esc(cur.version_name)+'-dən köhnə tətbiqlər yeniləmə ekranını görür'+
            (cur.min_version_set_at?' (təyin: '+fmtDT(cur.min_version_set_at)+')':'')+'.'+(cur.min_version_note?'<br>Qeyd: '+esc(cur.min_version_note):'')+'</div>'+
          '<button class="btn block" id="mvoff">Məcburi yeniləməni söndür</button>'
        : '<div class="hint" style="margin-top:0">Söndürülüb. Müştərilər "Sonra" seçə bilir.</div>'+
          '<div class="kv"><div><small>'+esc(cur.version_name)+' quraşdırılıb</small>'+latestOn+' cihaz</div><div><small>Köhnə versiyada</small>'+st.below+' cihaz ('+st.belowActive+' aktiv)</div></div>'+
          (vers?'<div class="hint" style="margin-top:0">Köhnə versiyalar: '+vers+'</div>':'')+
          '<label>Müştəriyə səbəb (istəyə bağlı)</label><input id="mvnote" maxlength="200" placeholder="məs. Vacib təhlükəsizlik yeniləməsi">'+
          '<label class="chk"><input type="checkbox" id="mvchk">'+esc(cur.version_name)+' versiyasını öz cihazımda quraşdırıb yoxladım</label>'+
          '<button class="btn danger block" id="mvon">'+esc(cur.version_name)+' versiyasını məcburi et</button>'+
          '<div class="hint">2.7.0 və yeni tətbiqlərdə "Sonra" düyməsi olmayan tam ekran yeniləmə açılır. 2.6.0 və köhnə tətbiqlər adi təklif görür, amma quraşdırıcı kodu onlarda işləmir. Abunəlik bloklanmır.</div>')+
    '</div>';
}
function wireMinVersion(box, cur){
  var on=box.querySelector('#mvon'), off=box.querySelector('#mvoff');
  if(on) on.onclick=guard(async function(){
    if(!box.querySelector('#mvchk').checked){ toast('Əvvəl yeni versiyanı öz cihazınızda yoxlayın və işarələyin',{bad:true}); return 'skip'; }
    var st=versionStats(cur.version_code);
    var latestOn=devices.filter(function(d){ return verCode(d.app_version)>=cur.version_code; }).length;
    if(!latestOn){ toast('Heç bir cihazda hələ '+cur.version_name+' yoxdur. Əvvəl öz cihazınızı yeniləyin.',{bad:true}); return 'skip'; }
    var msg=cur.version_name+' MƏCBURİ olsun?\n\n'+st.below+' cihaz ('+st.belowActive+' aktiv müştəri) köhnə versiyadadır. '+
      '2.7.0+ olanlar növbəti yoxlamada (5 dəq) "Sonra"sız yeniləmə ekranı görəcək.\n\nTəsdiq üçün TƏSDİQ yazın:';
    var typed=prompt(msg,''); if(typed===null) return 'skip';
    if(String(typed).trim().toUpperCase()!=='TƏSDİQ' && String(typed).trim().toUpperCase()!=='TESDIQ'){ toast('Təsdiq sözü düzgün yazılmadı — heç nə dəyişmədi',{bad:true}); return 'skip'; }
    var note=(box.querySelector('#mvnote').value||'').trim()||null;
    var r=await sb.from('app_release').update({ min_version_code:cur.version_code, min_version_note:note, min_version_set_at:new Date().toISOString() }).eq('id',1);
    if(r.error) throw r.error;
    toast('Məcburi yeniləmə aktivdir'); openRelease();
  });
  if(off) off.onclick=guard(async function(){
    if(!confirm('Məcburi yeniləmə söndürülsün? Müştərilər yenə "Sonra" seçə biləcək.')) return 'skip';
    var r=await sb.from('app_release').update({ min_version_code:0, min_version_note:null }).eq('id',1);
    if(r.error) throw r.error;
    toast('Söndürüldü'); openRelease();
  });
}

function vcName(c){ c=+c||0; return c ? Math.floor(c/10000)+'.'+Math.floor(c%10000/100)+'.'+(c%100) : 'söndürülüb'; }

function logDetails(l){
  var x=l.details||{};
  switch(l.action){
    case 'activate': case 'payment_add': case 'trial':
      return (x.months? x.months+' ay' : x.days+' gün')+(x.amount!=null?' · '+Number(x.amount).toFixed(2)+' ₼':'')+' · '+dayOrDash(x.from)+' → '+dayOrDash(x.to)+(x.note?' · '+esc(x.note):'')+(x.override_reason?' · fərqli məbləğ ('+(x.expected!=null?'tarif '+Number(x.expected).toFixed(2)+' ₼':'tarif yox')+'): '+esc(x.override_reason):'');

var errFilter={ kind:'', ver:'', model:'' };

        '<div class="errmsg">'+esc(e.message||'')+'</div>'+
        '<div class="m">'+esc([e.app_version?'v'+e.app_version:'', e.model, e.android?'Android '+e.android:''].filter(Boolean).join(' · '))+'</div>'+
        '<div class="m">Son: '+fmtDT(e.last_seen)+' · ilk: '+fmtDT(e.first_seen)+'</div></div>';

  }
  box.className='';
  box.innerHTML='<div class="chips">'+[['','Hamısı'],['js','JS'],['native','Native'],['update','Yeniləmə']].map(function(x){ return '<button class="chip'+(errFilter.kind===x[0]?' on':'')+'" data-k="'+x[0]+'">'+x[1]+'</button>'; }).join('')+'</div>'+
    '<div class="filters"><select id="fv"><option value="">Bütün versiyalar</option>'+Object.keys(vers).sort().reverse().map(function(v){ return '<option'+(errFilter.ver===v?' selected':'')+'>'+esc(v)+'</option>'; }).join('')+'</select>'+
    '<select id="fm"><option value="">Bütün modellər</option>'+Object.keys(models).sort().map(function(m){ return '<option'+(errFilter.model===m?' selected':'')+'>'+esc(m)+'</option>'; }).join('')+'</select></div>'+
    '<div id="elist"></div><button class="btn danger block" id="eclr">Təmizlə</button>';

  box.querySelector('#fv').onchange=function(e){ errFilter.ver=e.target.value; draw(); };
  box.querySelector('#fm').onchange=function(e){ errFilter.model=e.target.value; draw(); };

    var ids=filtered().map(function(e){ return e.id; });

/* single-series daily bar chart (hours); rows: [{day, sec}] */
function wbarsHtml(rows){
  var max=0; rows.forEach(function(r){ if(r.sec>max) max=r.sec; });
  if(!max) return '<div class="hint" style="margin-top:6px">Bu dövrdə baxış qeydə alınmayıb.</div>';
  return '<div class="wchart"><div class="wbars"><span class="wmax">'+hrs(max)+'</span>'+rows.map(function(r){
      var h=Math.max(2,Math.round(r.sec/max*92));
      return '<i'+(r.sec?'':' class="z"')+' style="height:'+h+'px" data-t="'+esc(dshort(r.day).replace(/ \d{4}$/,'')+': '+hrs(r.sec))+'"></i>'; }).join('')+
    '</div><div class="waxis"><span>'+esc(dshort(rows[0].day))+'</span><span>'+esc(dshort(rows[rows.length-1].day))+'</span></div></div>';
}
function dayRange(from, to){ var out=[], d=from; while(d<=to){ out.push(d); d=addDaysStr(d,1); } return out; }
var watchByDev=null;   /* device_id → {sec, last} for the last 14 days (v2.10) */
async function loadWatchIdle(){
  var to=todayStr(), r=await sb.rpc('watch_overview',{ p_from:addDaysStr(to,-13), p_to:to });
  if(r.error || !r.data || r.data.enabled===false){ watchByDev=null; return; }
  watchByDev={}; (r.data.customers||[]).forEach(function(c){ watchByDev[c.device_id]={ sec:+c.seconds||0, last:c.last_day }; });
}
function isIdle(d){ return !!watchByDev && !d.is_test && statusOf(d)==='active' && !d.replaced_by && !(watchByDev[d.id] && watchByDev[d.id].sec>0); }
function todayStr(){ var p=bk(Date.now()); return p.y+'-'+pad(p.m+1)+'-'+pad(p.d); }
function addDaysStr(s, n){ var d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function addMonthsStr(s, n){ var d=new Date(s+'T00:00:00Z'), day=d.getUTCDate(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+n); var dim=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate(); d.setUTCDate(Math.min(day,dim)); return d.toISOString().slice(0,10); }
function daysLeft(dateStr){ if(!dateStr) return null; return Math.round((Date.parse(dateStr+'T00:00:00Z')-Date.parse(todayStr()+'T00:00:00Z'))/864e5); }
function accName(a){ return (a.label ? a.label+' · ' : '')+a.subuser; }
function pill(pair){ return pair ? '<span class="pill '+pair[1]+'">'+esc(pair[0])+'</span>' : ''; }
function v28missing(e){ var m=(e && (e.message||''))||''; return /Could not find the function|does not exist|schema cache/.test(m); }
function csvDownload(name, rows){
  var csv=rows.map(function(r){ return r.map(function(c){ c=c==null?'':String(c); return /[",;\n]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c; }).join(';'); }).join('\r\n');
  var blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------------- "Müştərini ayır və yeri boşalt" ---------------- */
function findAsg(asgId){
  var out=null;
  (iptv.accounts||[]).forEach(function(a){ (a.slots||[]).forEach(function(s){ if(s.assignment && s.assignment.id===asgId) out={ acc:a, slot:s, x:s.assignment }; }); });
  return out;
}
function openRelease2(asgId, back){
  var f=findAsg(asgId); if(!f){ toast('Təyinat tapılmadı',{bad:true}); return; }
  var x=f.x, a=f.acc;
  var bg=sheet('release2');
  bg.innerHTML='<div class="sheet"><div class="top"><div class="grow"><h2>Müştərini ayır və yeri boşalt</h2></div><button class="icon-btn" id="x">'+ICON.close+'</button></div>'+
    '<div class="kv" style="margin-top:0"><div><small>Müştəri</small>#'+esc(x.customer_no)+(x.customer_name?' · '+esc(x.customer_name):'')+(x.phone?'<br>'+esc(x.phone):'')+'</div><div><small>Hesab · yer</small>'+esc(accName(a))+' · yer '+x.slot+'</div>'+
    '<div><small>MAC</small><span class="mono">'+esc(x.mac)+'</span></div><div><small>Playlist cihazda</small>'+(x.delivered?'Bəli — silinməlidir':'Xeyr (hələ almayıb)')+'</div></div>'+
    '<label>VEXO abunəliyi ilə nə edilsin?</label>'+
    '<label class="chk"><input type="radio" name="md" value="block" checked> Bloklansın (sonra "Bloku aç" ilə qaytarmaq olar)</label>'+
    '<label class="chk"><input type="radio" name="md" value="expire"> Abunəlik bu an bitsin</label>'+
    '<label class="chk"><input type="radio" name="md" value="none"> Toxunulmasın (yalnız IPTV yeri boşalsın)</label>'+
    '<label>Səbəb (müştəri bloklanarsa ekranda görünür)</label><input id="nt" maxlength="200" placeholder="məs. Ödəniş edilməyib">'+
    '<div class="warnbox"><b>Bilmək vacibdir:</b><br>• TV onlayndırsa playlist 5 dəqiqə ərzində silinir; oflayndırsa silinmə "gözləyir" kimi qalır və TV qoşulanda tamamlanır.<br>'+
      '• Favoritlər, ayarlar və ödəniş tarixçəsi silinmir.<br>• TV-dən silmək TVTEAM-dəki parolu <b>ləğv etmir</b>: müştəri parolu yazıb saxlayıbsa, istifadə edə bilər. Yer başqasına veriləcəksə, TVTEAM-də parolu dəyişin və burada yeni parolu yazın.</div>'+
    '<label class="chk"><input type="checkbox" id="ck"> Müştərini və hesabı yoxladım</label>'+
    '<button class="btn danger block" id="go">Ayır və yeri boşalt</button></div>';
  bg.querySelector('#x').onclick=function(){ back ? openAccount(back) : closeSheet(); };
  bg.querySelector('#go').onclick=guard(async function(){
    if(!bg.querySelector('#ck').checked){ toast('Əvvəl təsdiq qutusunu işarələyin',{bad:true}); return 'skip'; }
    var mode=bg.querySelector('input[name="md"]:checked').value;
    var r=await sb.rpc('release_slot',{ p_assignment_id:asgId, p_mode:mode, p_note:bg.querySelector('#nt').value.trim()||null });

function openAssignPicker(accId, slot, force){
  var a=iptv.accounts.find(function(x){ return x.id===accId; }); if(!a) return;
  var bg=sheet('assign'), q='';
  bg.innerHTML='<div class="sheet"><div class="top"><div class="grow"><h2>Yer '+slot+' — müştəri təyin et</h2><div class="hint" style="margin-top:4px">'+esc(accName(a))+'</div></div><button class="icon-btn" id="x">'+ICON.close+'</button></div>'+
    (force?'<div class="warnbox" style="margin-top:0"><b>Əvvəlki müştərinin TV-si hələ silinməni təsdiqləməyib.</b> TVTEAM-də bu sub-user-in parolunu dəyişdinizsə və yeni parolu burada yazdınızsa, davam edin.<label class="chk"><input type="checkbox" id="fc"> Parolu TVTEAM-də dəyişdim və ya riski qəbul edirəm</label></div>':'')+
    '<div class="search" style="margin-top:10px">'+ICON.search+'<input id="q" placeholder="ID, ad, telefon, MAC" autocomplete="off"></div><div id="pl" class="list"></div></div>';
  bg.querySelector('#x').onclick=function(){ openAccount(accId); };
  function draw(){
    var qq=q.toLowerCase().replace(/[\s\-#:()+]/g,'');
    var list=devices.filter(function(d){ return !iptvByDev[d.id] && !d.blocked && !d.replaced_by; })
      .filter(function(d){ return !qq || [d.customer_no,d.customer_name,d.phone,d.mac].join('|').toLowerCase().replace(/[\s\-#:()+]/g,'').indexOf(qq)>=0; })
      .sort(function(x,y){ var o={active:0,pending:1,expired:2}; return (o[statusOf(x)]-o[statusOf(y)]) || (x.customer_no-y.customer_no); }).slice(0,30);
    bg.querySelector('#pl').innerHTML = list.length ? list.map(function(d){ var s=ST[statusOf(d)];
      return '<div class="row"><div class="main"><div class="l1"><span class="no">#'+esc(d.customer_no)+'</span><span class="nm">'+esc(d.customer_name||'Ad yazılmayıb')+'</span>'+pill(s)+(verCode(d.app_version)<20800?'<span class="pill warn">'+esc(d.app_version||'?')+'</span>':'')+'</div><div class="l2"><span class="mono">'+esc(d.mac)+'</span>'+(d.phone?' · '+esc(d.phone):'')+'</div></div>'+
        '<button class="btn primary pay-btn" data-pick="'+d.id+'">Təyin et</button></div>'; }).join('') : '<div class="empty">IPTV yeri olmayan uyğun müştəri yoxdur.</div>';
    bg.querySelectorAll('[data-pick]').forEach(function(b){ b.onclick=guard(async function(){
      if(force && !bg.querySelector('#fc').checked){ toast('Əvvəl xəbərdarlığı təsdiqləyin',{bad:true}); return 'skip'; }
      var r=await sb.rpc('assign_slot',{ p_account_id:accId, p_device_id:b.getAttribute('data-pick'), p_slot_no:slot, p_force:!!force });

var finF={ range:'month', from:'', to:'' };
function finRange(){
  var p=bk(Date.now()), ym=function(y,m){ return y+'-'+pad(m+1)+'-01'; };
  if(finF.range==='last'){ var m=p.m-1, y=p.y; if(m<0){ m=11; y--; } return [ym(y,m), ym(y,m)]; }
  if(finF.range==='year') return [ym(p.y,0), ym(p.y,p.m)];
  if(finF.range==='12'){ var m2=p.m-11, y2=p.y; while(m2<0){ m2+=12; y2--; } return [ym(y2,m2), ym(p.y,p.m)]; }
  if(finF.range==='custom' && finF.from && finF.to) return [finF.from+'-01', finF.to+'-01'];
  return [ym(p.y,p.m), ym(p.y,p.m)];
}

    '<div class="sec"><h3>Partnyorlar (avtomatik bölünmür)</h3>'+((R.partners||[]).length?'<table class="rep-tab"><tr><td class="m">Partnyor</td><td class="r m">Aldığı</td><td class="r m">Ödədiyi</td></tr>'+R.partners.map(function(p){ return '<tr><td>'+esc(p.partner||'(göstərilməyib)')+'</td><td class="r">'+money(p.collected)+'</td><td class="r">'+money(p.paid)+'</td></tr>'; }).join('')+'</table>':'<div class="hint" style="margin-top:0">Bu dövrdə qeyd yoxdur.</div>')+'</div>'+
    '<div class="sec"><h3 hidden>Yeni gəlir / xərc</h3><details class="fold" id="eform" style="margin-top:0"><summary>+ Xərc və ya gəlir əlavə et</summary><div class="grid2">'+
      '<div><label>Növ</label><select id="ek"><option value="expense">Xərc</option><option value="income">Gəlir</option></select></div><div><label>Kateqoriya</label><select id="ec"></select></div>'+
      '<div><label>Tarix</label><input id="ed" type="date" value="'+todayStr()+'"></div><div><label>Məbləğ</label><input id="ea" type="number" min="0" step="0.01" inputmode="decimal"></div>'+
      '<div><label>Valyuta</label><select id="ecu">'+CURR.map(function(c){ return '<option>'+c+'</option>'; }).join('')+'</select></div><div><label>Məzənnə (1 vahid = ? AZN)</label><input id="er" type="number" min="0" step="0.0001" value="1" disabled></div>'+
      '<div><label>Üsul</label><select id="em"><option value="">—</option>'+Object.keys(METHOD).map(function(k){ return '<option value="'+k+'">'+METHOD[k]+'</option>'; }).join('')+'</select></div><div><label id="epl">Kim ödədi</label><input id="ep" list="partners"></div></div>'+
      '<label>Müştəri ID (istəyə bağlı)</label><input id="ecn" inputmode="numeric" placeholder="məs. 1005">'+
      '<label>Təsvir</label><input id="eds" maxlength="300">'+
      '<div class="preview" id="epv"></div>'+partnerOptions()+
      '<button class="btn green block" id="eadd">Əlavə et</button>'+
      '<div class="hint">Abunə ödənişləri buraya yazılmır — onlar müştəri kartından daxil olur. TVTEAM paketləri IPTV hesabında yazılır.</div></details></div>'+
    '<div class="sec"><h3>Bu dövrün qeydləri</h3><div id="elst"></div><div class="rowbtns"><button class="btn" id="ecsv">CSV ixrac (hesabat + qeydlər)</button></div></div>'+
    '<div class="sec"><h3>Ayarlar</h3><div class="grid2"><div><label>Standart aylıq tarif (AZN)</label><input id="sfee" type="number" min="0" step="0.01" value="'+esc(s.monthly_fee_azn!=null?s.monthly_fee_azn:'')+'"></div>'+
      '<div><label>Partnyorlar (vergüllə)</label><input id="sprt" value="'+esc((s.partners||[]).join(', '))+'" placeholder="məs. Nizami, Elvin"></div></div><button class="btn block" id="ssv">Yadda saxla</button><div class="hint">Standart tarif — ayrıca tarifi olmayan müştərilər üçün. Müştərinin öz tarifi kartında, "Müştəri" bölməsində təyin olunur. Tarif dəyişəndə əvvəlki ödənişlər dəyişmir.</div></div>';
  var $=function(q){ return box.querySelector(q); };
  $('#frep').onclick=function(){ repMonth=0; openReport(); };
  box.querySelectorAll('[data-fr]').forEach(function(b){ b.onclick=function(){ finF.range=b.getAttribute('data-fr'); if(finF.range==='custom'&&!finF.from){ var p=bk(Date.now()); finF.from=finF.to=p.y+'-'+pad(p.m+1); } openFinance(); }; });
  if($('#fgo')) $('#fgo').onclick=function(){ finF.from=$('#ff').value; finF.to=$('#ft').value; if(!finF.from||!finF.to||finF.to<finF.from){ toast('Ayları yoxlayın',{bad:true}); return; } openFinance(); };
  function cats(){ var k=$('#ek').value, c=FCAT[k]; $('#ec').innerHTML=Object.keys(c).map(function(x){ return '<option value="'+x+'">'+c[x]+'</option>'; }).join(''); $('#epl').textContent=k==='income'?'Kim aldı':'Kim ödədi'; prev(); }
  function prev(){ var cu=$('#ecu').value; $('#er').disabled=cu==='AZN'; if(cu==='AZN') $('#er').value=1; $('#epv').innerHTML='AZN ilə: <b>'+money(Number($('#ea').value||0)*Number($('#er').value||0))+'</b>'; }
  $('#ek').onchange=cats; ['#ea','#er','#ecu'].forEach(function(q){ $(q).oninput=prev; $(q).onchange=prev; }); cats();
  $('#eadd').onclick=guard(async function(){
    var amt=Number($('#ea').value); if(!(amt>0)){ toast('Məbləği yazın',{bad:true}); return 'skip'; }
    if($('#ecu').value!=='AZN' && !(Number($('#er').value)>0)){ toast('Məzənnəni yazın',{bad:true}); return 'skip'; }
    var dev=null, cn=$('#ecn').value.trim(); if(cn){ var d=devices.find(function(x){ return String(x.customer_no)===cn.replace(/\D/g,''); }); if(!d){ toast('Müştəri tapılmadı',{bad:true}); return 'skip'; } dev=d.id; }
    var q=await sb.rpc('finance_add',{ p_kind:$('#ek').value, p_category:$('#ec').value, p_date:$('#ed').value, p_amount:amt, p_currency:$('#ecu').value, p_fx_rate:Number($('#er').value),
      p_method:$('#em').value||null, p_partner:$('#ep').value.trim()||null, p_description:$('#eds').value.trim()||null, p_device_id:dev });
    if(q.error) throw q.error; toast('Əlavə olundu ('+money(q.data.amount_azn)+')'); openFinance(); return 'skip';
  });
  var items=[];
  (py.data||[]).forEach(function(p){ var d=byId[p.device_id], bp=bk(Date.parse(p.created_at)), day=bp.y+'-'+pad(bp.m+1)+'-'+pad(bp.d); items.push({ d:dshort(day), iso:day+'T'+p.created_at.slice(11), t:'Abunə ödənişi', who:(d?'#'+d.customer_no:'')+' · '+(p.months?p.months+' ay':p.days+' gün')+(p.override_reason?' · fərqli məbləğ: '+p.override_reason:''), m:p.method, p:p.received_by, amt:+p.amount||0, sign:1, voided:!!p.voided_at, vr:p.void_reason }); });
  (fe.data||[]).forEach(function(f){ items.push({ id:f.id, d:dshort(f.entry_date), iso:f.entry_date, t:(FCAT[f.kind]||{})[f.category]||f.category, who:(f.description||'')+(f.currency!=='AZN'?' ('+f.amount+' '+f.currency+' × '+f.fx_rate+')':''), m:f.method, p:f.partner, amt:+f.amount_azn, sign:f.kind==='income'?1:-1, voided:!!f.voided_at, vr:f.void_reason }); });
  pk.forEach(function(p){ items.push({ d:dshort(p.purchased_on), iso:p.purchased_on, t:'Provayder: '+(p.kind==='renewal'?'yeniləmə':'alış'), who:p.acc+' · '+p.package+(p.currency!=='AZN'?' ('+p.amount+' '+p.currency+' × '+p.fx_rate+')':''), p:p.paid_by, amt:+p.amount_azn, sign:-1, voided:p.voided, vr:p.void_reason }); });
  items.sort(function(a,b){ return String(b.iso).localeCompare(String(a.iso)); });
  $('#elst').innerHTML = items.length ? items.slice(0,300).map(function(i){
    return '<div class="payh"><div>'+(i.voided?'<s>':'')+esc(i.d)+' · '+esc(i.t)+(i.voided?'</s> <span class="m">ləğv: '+esc(i.vr||'')+'</span>':'')+'<div class="m">'+esc(i.who||'')+(i.m?' · '+esc(METHOD[i.m]||i.m):'')+(i.p?' · '+esc(i.p):'')+'</div></div>'+
      '<div style="white-space:nowrap;color:'+(i.voided?'var(--muted)':i.sign>0?'var(--ok)':'#ff8a8a')+'">'+(i.voided?'<s>':'')+(i.sign>0?'+':'−')+money(i.amt)+(i.voided?'</s>':'')+(i.id&&!i.voided?'<button class="undo" data-fv="'+i.id+'">Ləğv et</button>':'')+'</div></div>'; }).join('') : '<div class="hint" style="margin-top:0">Qeyd yoxdur.</div>';
  box.querySelectorAll('[data-fv]').forEach(function(b){ b.onclick=guard(async function(){
    var why=prompt('Qeyd ləğv olunsun? Səbəb yazın (silinmir, "ləğv" kimi qalır):',''); if(why===null) return 'skip'; if(why.trim().length<3){ toast('Səbəb yazın',{bad:true}); return 'skip'; }
    var q=await sb.rpc('finance_void',{ p_id:+b.getAttribute('data-fv'), p_reason:why.trim() }); if(q.error) throw q.error; toast('Ləğv olundu'); openFinance(); return 'skip'; }); });
  $('#ecsv').onclick=function(){
    function n2(x){ return x==null||x===''?'':Number(x).toFixed(2); }
    var rows=[['VEXO maliyyə hesabatı (AZN)',R.from,R.to],[],
      ['Ay','KASSA: Abunə ödənişləri','KASSA: Quraşdırma gəliri','KASSA: Digər gəlir','KASSA: Daxil olan cəmi','KASSA: Provayderə ödənilən','KASSA: Digər xərclər','KASSA: Çıxış cəmi','KASSA: Pul axını',
       'MƏNFƏƏT: Abunə gəliri (xidmət aylarına bölünmüş)','MƏNFƏƏT: Gəlir cəmi','MƏNFƏƏT: Provayder xərci (bölünmüş)','MƏNFƏƏT: Ümumi mənfəət','MƏNFƏƏT: Xalis nəticə']];
    function line(lbl,m){ return [lbl,n2(m.sub_income),n2(m.install_income),n2(m.other_income),n2(m.revenue),n2(m.provider_cash),n2(m.op_expenses),n2(m.cash_out),n2(m.cash_flow),
      n2(v2?m.sub_revenue:m.sub_income),n2(acc(m)),n2(m.provider_alloc),n2(m.gross_profit),n2(m.net_operating)]; }
    (R.months||[]).forEach(function(m){ rows.push(line(m.month,m)); });
    rows.push(line('CƏMİ',T));
    rows.push([]);
    if(v2) rows.push(['Müştərilərin qabaqcadan ödədiyi (gələcək aylara aid)',n2(R.deferred_revenue)]);
    rows.push(['Provayderə qabaqcadan ödənilmiş qalıq',n2(R.prepaid_remaining)]);
    rows.push([]); rows.push(['Partnyor','Aldığı','Ödədiyi']); (R.partners||[]).forEach(function(p){ rows.push([p.partner||'(göstərilməyib)',p.collected,p.paid]); });
    rows.push([]); rows.push(['Tarix','Növ','Təsvir','Üsul','Partnyor','AZN','Ləğv']);
    items.forEach(function(i){ rows.push([i.iso? String(i.iso).slice(0,10):'',i.t,i.who,i.m?METHOD[i.m]||i.m:'',i.p||'',(i.sign>0?'':'-')+i.amt.toFixed(2),i.voided?'ləğv: '+(i.vr||''):'']); });
    csvDownload('vexo-maliyye-'+R.from+'-'+R.to+'.csv', rows);
  };
  $('#ssv').onclick=guard(async function(){
    var fee=$('#sfee').value.trim(), prt=$('#sprt').value.split(',').map(function(x){ return x.trim(); }).filter(Boolean).slice(0,10);
    var w=await sb.from('app_settings').update({ monthly_fee_azn: fee===''?null:Number(fee), partners:prt }).eq('id',1); if(w.error) throw w.error;
    toast('Yadda saxlanıldı'); openFinance(); return 'skip';
  });
}

/* ---------------- Ayarlar: "2 müştəri / 1 hesab" ---------------- */
function resaleHtml(s){
  if(!('resale_enabled' in s)) return '';
  return '<div class="sec"><h3>2 müştəri / 1 IPTV hesabı</h3>'+
    (s.resale_enabled
      ? '<div class="warnbox" style="margin-top:0"><b>AÇIQDIR.</b> Bir hesaba 2 müştəri təyin oluna bilər (eyni anda qoşulma limitini keçmədən). İcazə sənədi: '+esc(s.resale_approval_ref||'—')+(s.resale_set_at?' · '+fmtDT(s.resale_set_at):'')+'</div><button class="btn block" id="rsoff">Söndür (hər hesaba 1 müştəri)</button>'
      : '<div class="hint" style="margin-top:0"><b>Sönülüdür</b> — hər hesaba yalnız 1 müştəri. Provayderin (TVTEAM) bu istifadəyə <b>yazılı icazəsi</b> olmadan açmayın.</div>'+
        '<label>İcazə sənədi (məs. "TVTEAM e-poçtu, 12.11.2026, ticket #123")</label><input id="rsref" maxlength="300">'+
        '<label class="chk"><input type="checkbox" id="rsck"> Provayderin yazılı icazəsi məndədir və onu saxlamışam</label>'+
        '<button class="btn danger block" id="rson">2 müştəri rejimini aç</button>')+
    '<div class="hint">Söndürüləndə artıq 2 müştərisi olan hesablarda 2-ci müştəri yeni playlist almır (silinmir); onları başqa hesaba köçürün.</div></div>';
}
function wireResale(box){
  var on=box.querySelector('#rson'), off=box.querySelector('#rsoff');
  if(on) on.onclick=guard(async function(){
    var ref=box.querySelector('#rsref').value.trim();
    if(ref.length<5){ toast('İcazə sənədini yazın',{bad:true}); return 'skip'; }
    if(!box.querySelector('#rsck').checked){ toast('Əvvəl təsdiq qutusunu işarələyin',{bad:true}); return 'skip'; }
    var typed=prompt('2 müştəri / 1 hesab rejimi açılsın?\n\nTəsdiq üçün TƏSDİQ yazın:',''); if(typed===null) return 'skip';
    var r=await sb.rpc('set_resale_mode',{ p_enabled:true, p_approval_ref:ref, p_confirm:confirmWord(typed) });
    if(r.error) throw r.error; toast('Açıldı'); openSettings(); return 'skip';
  });
  if(off) off.onclick=guard(async function(){
    var typed=prompt('Söndürülsün? Hər hesaba yalnız 1 müştəri qalacaq.\n\nTəsdiq üçün TƏSDİQ yazın:',''); if(typed===null) return 'skip';
    var r=await sb.rpc('set_resale_mode',{ p_enabled:false, p_approval_ref:null, p_confirm:confirmWord(typed) });
    if(r.error) throw r.error; toast('Söndürüldü'); openSettings(); return 'skip';
  });
}

function guard(fn){
  return async function(){
    var b=this; b.disabled=true;
    try { var res=await fn(); if(res!=='skip') await load(); }
    catch(e){ toast(errText(e), {bad:true}); }
    finally { if(document.body.contains(b)) b.disabled=false; }
  };
}
async function upd(id, patch){ var r=await sb.from('devices').update(patch).eq('id',id); if(r.error) throw r.error; }

async function loadDeviceWatch(id){
  var to=todayStr(), from=addDaysStr(to,-29);
  var r;
  try { r=await sb.from('watch_daily').select('*').eq('device_id',id).gte('day',from).order('day',{ascending:true}).limit(60); }
  catch(e){ r={ error:{ message:String((e&&e.message)||e) } }; }
  var el=document.getElementById('wdev'); if(!el || current!==id) return;
  if(r.error){ el.textContent=/watch_daily|does not exist|schema cache/.test(r.error.message||'')?'Baxış statistikası üçün Supabase-də v2.10.0 miqrasiyası işlədilməlidir.':errText(r.error); return; }
  var by={}; (r.data||[]).forEach(function(x){ by[String(x.day).slice(0,10)]=(+x.live_seconds||0)+(+x.vod_seconds||0); });
  var rows=dayRange(from,to).map(function(d){ return { day:d, sec:by[d]||0 }; });
  function sum(n){ return rows.slice(-n).reduce(function(a,x){ return a+x.sec; },0); }
  var last=null; rows.forEach(function(x){ if(x.sec) last=x.day; });
  var live=0, vod=0; (r.data||[]).forEach(function(x){ live+=+x.live_seconds||0; vod+=+x.vod_seconds||0; });
  var off=settingsCache && settingsCache.watch_stats_enabled===false;
  el.className='';
  el.innerHTML=(off?'<div class="alertline" style="margin-top:0">Baxış statistikası söndürülüb (Ayarlar). Yeni məlumat toplanmır.</div>':'')+
    '<div class="subline" style="margin-top:0">Bu gün <b>'+hrs(sum(1))+'</b> · son 7 gün <b>'+hrs(sum(7))+'</b> · son 30 gün <b>'+hrs(sum(30))+'</b>'+
      (live+vod?' (kanal '+hrs(live)+', film/serial '+hrs(vod)+')':'')+'<br>Son baxış: <b>'+(last?(last===to?'bu gün':dshort(last)):'son 30 gündə yoxdur')+'</b></div>'+
    wbarsHtml(rows)+
    '<div class="hint">Yalnız ekranda həqiqətən oynayan vaxt sayılır. Tətbiq 2.8.5 və yenisi lazımdır.</div>';
}

async function loadPayments(id){
  var r=await sb.from('payments').select('*').eq('device_id',id).order('id',{ascending:false}).limit(60);
  var el=document.getElementById('pays'); if(!el || current!==id) return;
  if(r.error){ el.textContent=errText(r.error); return; }
  if(!r.data.length){ el.textContent='Ödəniş yoxdur.'; return; }
  var dev=devices.find(function(x){ return x.id===id; }), arch=!!(dev && dev.archived_at);
  var live=r.data.filter(function(p){ return !p.voided_at; });
  var undoId=(!arch && live.length) ? live[0].id : null;   /* yalnız son (geri alınmamış) ödəniş geri alına bilər */
  var total=live.reduce(function(s,p){ return s+Math.round((Number(p.amount)||0)*100); },0)/100;
  el.innerHTML=r.data.map(function(p){
    var per=p.months ? p.months+' ay' : p.days+' gün';
    var to=p.new_expires ? ' → '+lastDayShort(Date.parse(p.new_expires)) : '';
    var v=!!p.voided_at;
    return '<div class="payh'+(v?' void':'')+'"><div>'+(v?'<s>':'')+esc(fmtDT(p.created_at))+' · '+esc(per)+esc(to)+(v?'</s> <span class="m">· geri alınıb'+(p.voided_at?' '+esc(fmtDT(p.voided_at)):'')+'</span>':'')+
      (p.note?' <span class="m">· '+esc(p.note)+'</span>':'')+
      ((p.method||p.received_by)?' <span class="m">· '+esc([METHOD[p.method]||p.method, p.received_by].filter(Boolean).join(' · '))+'</span>':'')+
      (p.override_reason?' <span class="m">· fərqli məbləğ'+(p.expected_amount!=null?' (tarif '+esc(Number(p.expected_amount).toFixed(2))+' ₼)':'')+': '+esc(p.override_reason)+'</span>':'')+'</div>'+
      '<div style="white-space:nowrap">'+(v?'<s>':'')+(p.amount!=null?esc(Number(p.amount).toFixed(2))+' ₼':'—')+(v?'</s>':'')+(p.id===undoId?'<button class="undo" data-u="'+p.id+'">Geri al</button>':'')+'</div></div>';
  }).join('')+'<div class="payh"><div class="m">Cəmi'+(live.length<r.data.length?' (geri alınanlar sayılmır)':'')+'</div><div><b>'+total.toFixed(2)+' ₼</b></div></div>';
  var u=el.querySelector('[data-u]');
  if(u) u.onclick=guard(async function(){
    if(!confirm('Son ödəniş geri alınsın? Bitmə tarixi əvvəlki vəziyyətə qayıdacaq.\n\nÖdəniş silinmir — tarixçədə "geri alınıb" kimi qalır və hesabatlara düşmür.')) return 'skip';
    var r2=await sb.rpc('undo_payment',{ p_payment_id:+u.getAttribute('data-u') }); if(r2.error) throw r2.error;
    toast('Ödəniş geri alındı');
  });
}

boot();
})();
</script>
